name: ci

on:
  push:
    branches:
      - melodic
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  cpp-quality:
    name: C++ quality
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run C++ quality gate in Docker
        run: |
          docker pull ros:melodic-ros-base-bionic
          docker run --rm \
            -e DEBIAN_FRONTEND=noninteractive \
            -v "$GITHUB_WORKSPACE:/workspace/estimator-rigid-state" \
            ros:melodic-ros-base-bionic \
            bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends ca-certificates
              echo "deb [trusted=yes arch=$(dpkg --print-architecture)] https://xgc2.apt.xiaokang.ink bionic main" \
                > /etc/apt/sources.list.d/xgc2.list
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential \
                clang-format \
                clang-tidy \
                cmake \
                git \
                libxgc2-math-dev \
                libxgc2-state-machine-dev \
                rsync \
                ros-melodic-geometry-msgs \
                ros-melodic-mavros-msgs \
                ros-melodic-message-generation \
                ros-melodic-roscpp \
                ros-melodic-rospy \
                ros-melodic-xgc2-estimator-rigid-state-msgs \
                ros-melodic-xgc2-ros1-utils \
                ros-melodic-sensor-msgs \
                ros-melodic-std-msgs

              cd /workspace/estimator-rigid-state
              .xgc2/scripts/check_cpp_quality.sh
            '

  package-compliance:
    name: Package compliance and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check package metadata
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --check HEAD

      - name: Build package and run launch compliance in Docker
        run: |
          docker pull ros:melodic-ros-base-bionic
          docker run --rm \
            -e DEBIAN_FRONTEND=noninteractive \
            -v "$GITHUB_WORKSPACE:/workspace/estimator-rigid-state:ro" \
            -v "$RUNNER_TEMP:/workspace/tmp" \
            ros:melodic-ros-base-bionic \
            bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends ca-certificates
              echo "deb [trusted=yes arch=$(dpkg --print-architecture)] https://xgc2.apt.xiaokang.ink bionic main" \
                > /etc/apt/sources.list.d/xgc2.list
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential \
                cmake \
                git \
                libxgc2-math-dev \
                libxgc2-state-machine-dev \
                rsync \
                ros-melodic-geometry-msgs \
                ros-melodic-mavros-msgs \
                ros-melodic-message-generation \
                ros-melodic-roscpp \
                ros-melodic-roslaunch \
                ros-melodic-rospack \
                ros-melodic-rospy \
                ros-melodic-xgc2-estimator-rigid-state-msgs \
                ros-melodic-xgc2-ros1-utils \
                ros-melodic-sensor-msgs \
                ros-melodic-std-msgs

              work_dir="/workspace/tmp/estimator-rigid-state-compliance"
              install_root="/workspace/tmp/estimator-rigid-state-install-root"
              rm -rf "$work_dir" "$install_root"
              mkdir -p "$work_dir/src/estimator-rigid-state"
              rsync -a --delete /workspace/estimator-rigid-state/ "$work_dir/src/estimator-rigid-state/"

              cd "$work_dir"
              set +u
              source /opt/ros/melodic/setup.bash
              set -u
              catkin_make run_tests_estimator_vrpn_px4_rotor_state run_tests_estimator_vrpn_ugv_state
              catkin_test_results
              DESTDIR="$install_root" catkin_make install \
                -DCMAKE_INSTALL_PREFIX=/opt/ros/melodic \
                -DCMAKE_BUILD_TYPE=Release
              set +u
              source devel/setup.bash
              set -u
              test "$(rospack find rigid_state_estimator_msgs)" = "/opt/ros/melodic/share/rigid_state_estimator_msgs"
              test "$(rospack find estimator_vrpn_px4_rotor_state)" = "$work_dir/src/estimator-rigid-state/estimator_vrpn_px4_rotor_state"
              test "$(rospack find estimator_vrpn_ugv_state)" = "$work_dir/src/estimator-rigid-state/estimator_vrpn_ugv_state"
              roslaunch --files estimator_vrpn_px4_rotor_state vrpn_px4_rotor_state_estimator.launch >/tmp/xgc2-vrpn-px4-rotor-state-estimator-files.txt
              roslaunch --files estimator_vrpn_ugv_state vrpn_ugv_state_estimator.launch >/tmp/xgc2-vrpn-ugv-state-estimator-files.txt
            '

  build-debs:
    name: Build debs (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Build and install-check deb package in Docker
        run: |
          .xgc2/scripts/build_debs_in_docker.sh \
            --work-dir "$RUNNER_TEMP/estimator-rigid-state-${{ matrix.arch }}" \
            --output-dir "$GITHUB_WORKSPACE/debs"

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xgc2-estimator-rigid-state-debs-${{ matrix.arch }}
          path: debs/*.deb
