imu_topic: /imu/data
vrpn_pose_topic: /vrpn_client_node/pose_0/pose
# Empty: do not fuse VRPN twist. Client twist is pose dirty-diff, not a velocity sensor.
vrpn_twist_topic: ""
state_topic: alg/state_estimator/state
vision_pose_topic: unused/vision_pose
pose_transport: pose
pose_source: vrpn

loop_rate_hz: 1000.0
state_publish_rate_hz: 100.0
vision_publish_rate_hz: 0.0

gravity_mps2: 9.8066
field_offset_xyz: [0.0, 0.0, 0.0]
field_offset_rpy: [0.0, 0.0, 0.0]
imu_to_vrpn_marker_xyz: [0.0, 0.0, 0.0]
imu_to_vrpn_marker_rpy: [0.0, 0.0, 0.0]
extrinsic_verified: false
estimate_extrinsic: false

imu_timeout_s: 0.2
vrpn_timeout_s: 0.12
coasting_timeout_s: 0.5
min_imu_rate_hz: 5.0
# 30 Hz field VRPN is acceptable (>> 10 Hz). A 20 Hz floor trips RATE_LOW on jitter.
min_vrpn_rate_hz: 8.0
max_time_jump_s: 0.25

# UGV values are continuous-time white-noise densities.
imu_noise_std_is_density: true
accel_noise_std: 0.35
gyro_noise_std: 0.03
vrpn_position_noise_std: 0.01
vrpn_orientation_noise_std: 0.01
vrpn_velocity_noise_std: 0.05
gyro_bias_random_walk_std: 0.0001
accel_bias_random_walk_std: 0.001
extrinsic_position_random_walk_std: 0.00001
extrinsic_orientation_random_walk_std: 0.00001
# Consecutive raw VRPN jump (ID hop / flyer): reject. Not filter-vs-VRPN lag.
innovation_position_gate_m: 1.5
innovation_orientation_gate_rad: 0.8
# Accepted VRPN always fused at this K (K = P/(P+R)). No lag inflate gate.
apply_pose_covariance_floor: true
pose_position_kalman_gain: 0.9
pose_orientation_kalman_gain: 0.8
pose_update_iterations: 1
pose_update_convergence: 0.00001
velocity_innovation_gate_mps: 3.0
pose_nis_gate: 22.5
covariance_high_threshold: 100.0
max_propagation_dt_s: 0.01
inertial_buffer_capacity: 128
pose_max_late_s: 0.12
pose_max_early_s: 0.12
# Structural prior: one IMU tick. Not a calibrated Motive-to-callback delay.
pose_observation_delay_s: 0.01
initial_position_variance: 0.01
initial_velocity_variance: 0.1
initial_orientation_variance: 0.01
initial_gyro_bias_variance: 0.01
initial_accel_bias_variance: 0.1
