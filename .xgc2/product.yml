schema: xgc2.product.v1
id: xgc2-estimator-rigid-state
name: XGC2 Rigid State Estimators
version: 1.1.6-1
kind: ros1-apt
summary: VRPN/IMU rigid state estimation packages for PX4 rotor UAVs and UGVs.
ros:
  distro: melodic
  packages:
  - estimator_vrpn_px4_rotor_state
  - estimator_vrpn_ugv_state
apt:
  distribution: bionic
  install:
  - ros-melodic-xgc2-estimator-rigid-state
  packages:
  - ros-melodic-xgc2-estimator-rigid-state
  depends:
  - libxgc2-math-dev (>= 0.5.6-2~bionic)
  - libxgc2-state-machine-dev (>= 0.1.3-2~bionic)
  - ros-melodic-xgc2-estimator-rigid-state-msgs (>= 1.2.0-1)
  - ros-melodic-mavros-msgs
  - ros-melodic-rospy
  - ros-melodic-xgc2-ros1-utils
usage:
  install: 'sudo apt update

    sudo apt install ros-melodic-xgc2-estimator-rigid-state

    '
  smoke_test: 'roslaunch --files estimator_vrpn_px4_rotor_state vrpn_px4_rotor_state_estimator.launch

    roslaunch --files estimator_vrpn_ugv_state vrpn_ugv_state_estimator.launch

    '
ownership:
  paths:
  - /opt/ros/melodic/share/estimator_vrpn_px4_rotor_state
  - /opt/ros/melodic/include/estimator_vrpn_px4_rotor_state
  - /opt/ros/melodic/lib/estimator_vrpn_px4_rotor_state
  - /opt/ros/melodic/lib/libestimator_vrpn_px4_rotor_state_core.so
  - /opt/ros/melodic/lib/libestimator_vrpn_px4_rotor_state_ros.so
  - /opt/ros/melodic/share/estimator_vrpn_ugv_state
  - /opt/ros/melodic/include/estimator_vrpn_ugv_state
  - /opt/ros/melodic/lib/estimator_vrpn_ugv_state
  - /opt/ros/melodic/lib/libestimator_vrpn_ugv_state_core.so
  - /opt/ros/melodic/lib/libestimator_vrpn_ugv_state_ros.so
