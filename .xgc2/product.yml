schema: xgc2.product.v1
id: xgc2-estimator-rigid-state
name: XGC2 Rigid State Estimators
version: 1.1.6-6
kind: ros1-apt
summary: VRPN/IMU rigid state estimation packages for PX4 rotor UAVs and UGVs.
ros:
  distro: noetic
  packages:
  - estimator_vrpn_px4_rotor_state
  - estimator_vrpn_ugv_state
apt:
  distribution: focal
  install:
  - ros-noetic-xgc2-estimator-rigid-state
  packages:
  - ros-noetic-xgc2-estimator-rigid-state
  depends:
  - libxgc2-math-dev (>= 0.5.6-6~focal)
  - libxgc2-state-machine-dev (>= 0.1.3-4~focal)
  - ros-noetic-xgc2-estimator-rigid-state-msgs (>= 1.2.0-3)
  - ros-noetic-mavros-msgs
  - ros-noetic-rospy
  - ros-noetic-xgc2-ros1-utils (>= 1.1.1-3)
usage:
  install: 'sudo apt update

    sudo apt install ros-noetic-xgc2-estimator-rigid-state

    '
  smoke_test: 'roslaunch --files estimator_vrpn_px4_rotor_state vrpn_px4_rotor_state_estimator.launch

    roslaunch --files estimator_vrpn_ugv_state vrpn_ugv_state_estimator.launch

    '
ownership:
  paths:
  - /opt/ros/noetic/share/estimator_vrpn_px4_rotor_state
  - /opt/ros/noetic/include/estimator_vrpn_px4_rotor_state
  - /opt/ros/noetic/lib/estimator_vrpn_px4_rotor_state
  - /opt/ros/noetic/lib/libestimator_vrpn_px4_rotor_state_core.so
  - /opt/ros/noetic/lib/libestimator_vrpn_px4_rotor_state_ros.so
  - /opt/ros/noetic/share/estimator_vrpn_ugv_state
  - /opt/ros/noetic/include/estimator_vrpn_ugv_state
  - /opt/ros/noetic/lib/estimator_vrpn_ugv_state
  - /opt/ros/noetic/lib/libestimator_vrpn_ugv_state_core.so
  - /opt/ros/noetic/lib/libestimator_vrpn_ugv_state_ros.so
release:
  dependency_policy:
    libxgc2-math-dev: rebuild
    libxgc2-state-machine-dev: rebuild
    xgc2-ros-msgs: rebuild
    xgc2-ros1-utils: rebuild
